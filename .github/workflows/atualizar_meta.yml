name: Atualizacao Diaria do Meta Warzone

on:
  schedule:
    # 03:00 UTC = 00:00 Horário de Brasília
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sincronizar-meta:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar bibliotecas de sistema do Linux para o Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            xdg-utils

      - name: Instalar Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Executar script de atualizacao do Meta
        run: node atualizar_meta_local.js

      - name: Salvar alteracoes nos arquivos JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(meta): atualizacao automatica CODMunity [skip ci]" && git push)